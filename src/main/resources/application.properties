spring.application.name=batch

# CONFIGURACIÓN DE LA BASE DE DATOS H2
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 - puedes verla en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Spring Batch - NO ejecutar jobs automáticamente al iniciar
spring.batch.job.enabled=true

# Inicializar tablas de Spring Batch en H2
spring.batch.jdbc.initialize-schema=always

# Logging para ver lo que hace el batch
logging.level.org.springframework.batch=INFO
logging.level.com.example.batch=DEBUG